<form class="register-form" id="register-form" (ngSubmit)="onSubmit()" #registerForm="ngForm">

  <div class="register-grid">

    <!-- Nombre -->
    <div class="form-group">
      <label class="form-label">
        <i class="fas fa-user label-icon"></i> Nombre <span class="required">*</span>
      </label>
      <input
        type="text"
        class="form-control"
        placeholder="Tu primer nombre"
        [(ngModel)]="user.firstName"
        name="firstName"
        required
      />
    </div>

    <!-- Segundo nombre -->
    <div class="form-group">
      <label class="form-label">
        <i class="fas fa-user label-icon"></i> Segundo nombre
        <span class="optional">opcional</span>
      </label>
      <input
        type="text"
        class="form-control"
        placeholder="Segundo nombre"
        [(ngModel)]="user.middleName"
        name="middleName"
      />
    </div>

    <!-- Primer apellido -->
    <div class="form-group">
      <label class="form-label">
        <i class="fas fa-id-card label-icon"></i> Primer apellido <span class="required">*</span>
      </label>
      <input
        type="text"
        class="form-control"
        placeholder="Primer apellido"
        [(ngModel)]="user.lastName"
        name="lastName"
        required
      />
    </div>

    <!-- Segundo apellido -->
    <div class="form-group">
      <label class="form-label">
        <i class="fas fa-id-card label-icon"></i> Segundo apellido
      </label>
      <input
        type="text"
        class="form-control"
        placeholder="Segundo apellido"
        [(ngModel)]="user.secondLastName"
        name="secondLastName"
      />
    </div>

    <!-- Email (full width) -->
    <div class="form-group full-width">
      <label class="form-label">
        <i class="fas fa-envelope label-icon"></i> Correo electrónico <span class="required">*</span>
      </label>
      <input
        type="email"
        class="form-control"
        placeholder="tu@correo.com"
        [(ngModel)]="user.email"
        name="email"
        required
      />
    </div>

    <!-- Contraseña -->
    <div class="form-group">
      <label class="form-label">
        <i class="fas fa-lock label-icon"></i> Contraseña <span class="required">*</span>
      </label>
      <input
        type="password"
        class="form-control"
        placeholder="Mínimo 6 caracteres"
        [(ngModel)]="user.password"
        name="password"
        required
        minlength="6"
      />
    </div>

    <!-- Confirmar contraseña -->
    <div class="form-group">
      <label class="form-label">
        <i class="fas fa-lock label-icon"></i> Confirmar contraseña <span class="required">*</span>
      </label>
      <input
        type="password"
        class="form-control"
        [class.input-error]="confirmPassword && user.password !== confirmPassword"
        placeholder="Repite tu contraseña"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        required
      />
      @if (confirmPassword && user.password !== confirmPassword) {
        <small class="field-error">Las contraseñas no coinciden</small>
      }
    </div>

    <!-- Tipo de cuenta (full width) -->
    <div class="form-group full-width">
      <label class="form-label">
        <i class="fas fa-users-cog label-icon"></i> ¿Cuál es tu rol? <span class="required">*</span>
      </label>
      <div class="role-selector">
        @for (role of roles; track role.uniqueID) {
          <label
            class="role-option"
            [class.selected]="user.roles === role.uniqueID"
          >
            <input
              type="radio"
              [(ngModel)]="user.roles"
              name="roles"
              [value]="role.uniqueID"
              required
            />
            <span class="role-icon">
              <i [class]="role.name_rol === 'Profesor' ? 'fas fa-chalkboard-teacher' : 'fas fa-graduation-cap'"></i>
            </span>
            <span class="role-label">{{ role.name_rol }}</span>
            <span class="role-desc">
              {{ role.name_rol === 'Profesor' ? 'Ofrece asesorías y clases' : 'Busca asesoría y aprende' }}
            </span>
          </label>
        }
      </div>
    </div>

    <!-- Términos (full width) -->
    <div class="form-group full-width terms-group">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="acceptTerms" name="terms" required />
        <span>Acepto los <a href="#" class="link">términos y condiciones</a> y la <a href="#" class="link">política de privacidad</a></span>
      </label>
    </div>

  </div>

  <button
    type="submit"
    class="btn btn-primary btn-submit"
    [disabled]="registerForm.invalid || user.password !== confirmPassword || !acceptTerms"
  >
    <i class="fas fa-user-plus"></i> Crear cuenta
  </button>

  <p class="auth-footer">
    ¿Ya tienes cuenta?
    <a routerLink="/auth/login" class="link">Inicia sesión aquí</a>
  </p>

</form>
